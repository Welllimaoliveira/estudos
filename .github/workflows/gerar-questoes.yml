name: Gerar questões

on:
  schedule:
    # seg, qua e sex às 10:10 horário de Brasília
    - cron: "10 13 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-questoes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Enriquecer data/questoes.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gerar_questoes.py

      - name: Commitar
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: enriquece banco de questões"
          file_pattern: "data/questoes.json data/questoes_state.json"
